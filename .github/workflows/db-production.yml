name: Database - production

# The ONLY way migrations reach production, and only when a person starts it.
#
# Until 27 November 2026 this ran on every merge to main that changed
# supabase/migrations. With a client's live data on the other end, a merge must not
# reach its database with nobody in the loop, so it is manual: Actions → "Database -
# production" → Run workflow on main, typing the project ref. The ref is in this
# public file, so typing it guards against accidents, not against intent; the
# environment's protection rules do that. The plan step lists what will be applied
# before anything is.
#
# Order: merge to main (which deploys only the demo, against staging), run this, then
# deploy the release tag to the instance from itc1.kaffeelisten.de. A "deploy: pre"
# migration is safe under the code already running; a "deploy: post" one is run after
# the release that stops using what it removes. Procedure: docs/environments.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the production project ref to apply pending migrations'
        required: true

concurrency:
  group: db-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: fdnfdscpefxqvtggbbbr
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
    steps:
      # A wrong branch or a wrong ref fails the run, visibly; it never skips quietly.
      - name: Confirm the branch and the project
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production is migrated from main only. Nothing was applied."
            exit 1
          fi
          if [ "$CONFIRM" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::The typed project ref does not match production. Nothing was applied."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan
        run: node scripts/db/migrate.mjs --project-ref "$PRODUCTION_PROJECT_REF" --dry-run

      - name: Apply
        run: node scripts/db/migrate.mjs --project-ref "$PRODUCTION_PROJECT_REF" --production

      # Informational: staging may be ahead when another PR's migrations are open.
      - name: Compare schema with staging
        if: env.STAGING_PROJECT_REF != ''
        continue-on-error: true
        run: node scripts/db/drift.mjs --a "$STAGING_PROJECT_REF" --b "$PRODUCTION_PROJECT_REF"
