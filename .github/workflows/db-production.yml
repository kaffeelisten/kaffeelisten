name: Database - production

# The ONLY way migrations reach production, and only when a person starts it.
#
# Until 27 November 2026 this ran on every merge to main that changed
# supabase/migrations. With a client's live data on the other end, a merge must not
# reach its database with nobody in the loop, so it is manual: Actions → "Database -
# production" → Run workflow, typing the project ref to confirm. The plan step lists
# what will be applied before anything is. Every migration is "deploy: pre"
# (backwards-compatible, CI enforces it): run this BEFORE deploying a release that
# needs it, and the running code is unaffected. Procedure: docs/environments.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the production project ref to apply pending migrations'
        required: true

concurrency:
  group: db-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_PROJECT_REF: fdnfdscpefxqvtggbbbr
      STAGING_PROJECT_REF: ${{ vars.STAGING_PROJECT_REF || secrets.STAGING_PROJECT_REF }}
    steps:
      # A wrong or missing ref fails the run, visibly; it never skips quietly.
      - name: Confirm the project
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "$PRODUCTION_PROJECT_REF" ]; then
            echo "::error::Typed '$CONFIRM', expected the production project ref. Nothing was applied."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Plan
        run: node scripts/db/migrate.mjs --project-ref "$PRODUCTION_PROJECT_REF" --dry-run

      - name: Apply
        run: node scripts/db/migrate.mjs --project-ref "$PRODUCTION_PROJECT_REF" --production

      # Informational: staging may be ahead when another PR's migrations are open.
      - name: Compare schema with staging
        if: env.STAGING_PROJECT_REF != ''
        continue-on-error: true
        run: node scripts/db/drift.mjs --a "$STAGING_PROJECT_REF" --b "$PRODUCTION_PROJECT_REF"
